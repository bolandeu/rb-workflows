[project]
name = "rb-workflows"
dynamic = ["version"]
description = "Workflows as code (Windmill Workflow-as-Code) that run locally: fetch documents through a cascade of services"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Roman Bolandau" }]
dependencies = [
    "wmill>=1.0",
    "httpx[socks]>=0.27",
    "platformdirs>=4.2",  # 9router proxies are socks5 (httpx takes socksio)
    "psycopg[binary]>=3.2",  # the shared answer cache lives in PostgreSQL when WORKFLOWS_DATABASE_URL is set
    "rb-credentials>=0.7.1,<1",
    "trafilatura>=2.0",  # main text of a page for web-search --fetch-top: no menu, no footer, no ads
]

[project.scripts]
wf = "rb_workflows.cli:main"

[dependency-groups]
dev = [
    "rb-9router",  # local only: keys and proxies from 9router's database (RB_WORKFLOWS_SOURCE=9router)
    "mutmut>=3.8",  # mutation runs of one module at a time: `uv run mutmut run`
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "ty>=0.0.80",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/rb_workflows"]

# Siblings resolve from disk: a version range in `dependencies` plus a `path` source, never an index.
[tool.uv.sources]
rb-credentials = { path = "../rb-credentials", editable = true }
rb-9router = { path = "../rb-9router", editable = true }  # private, never published

[tool.ruff]
line-length = 120
extend-exclude = ["mutants"]  # mutmut's copy of the tree: its own code, not ours

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"src/rb_workflows/cli.py" = ["T20"]  # a CLI prints: that is its job

[tool.ty.src]
exclude = ["mutants"]  # mutmut's copy of the tree

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # the src layout and mutmut's copy under mutants/ import the same way
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"  # `live` spends money on the real services: `uv run pytest -m live`
markers = ["live: talks to the real services (the serp CLI, the network); excluded from the default run"]

[tool.mutmut]
# One module per run: the whole package is hours. Widen `source_paths` when a module gets its own test file.
source_paths = ["src/rb_workflows/flows/web_search.py"]
pytest_add_cli_args_test_selection = ["tests/test_web_search.py"]

[tool.rb.install]
homeserver = ["rbtools"]
mac = true

[[tool.rb.external]]
name = "token"
required = false
min_version = "0.1"
check = "token which"
why = "the machine-wide token store: `token get <service>` supplies a service's API token when the package store has none"
